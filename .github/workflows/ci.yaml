# CI for the Abaqus syntax highlighting extension.
#
# - On every branch push: lint, compile, and package one universal .vsix
#   (the extension has no native code, so one package serves every platform).
# - On a v* tag: verify the tag matches package.json, publish to the
#   VS Code Marketplace, and attach the .vsix to a GitHub Release.
name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

# Cancel superseded runs on the same branch; tag refs are unique per tag,
# so a release run is only ever cancelled by a re-push of the same tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the release job widens to contents: write.
permissions:
  contents: read

jobs:
  build:
    name: Lint, compile, package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        # Fail fast on a mismatched tag before spending minutes building.
        # The release job re-checks: belt and braces at the point of publish.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:   ${TAG_VERSION}"
          echo "package.json:  ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}. Refusing to publish."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Upload extension package
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'

  publish-and-release:
    name: Publish and create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:   ${TAG_VERSION}"
          echo "package.json:  ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}. Refusing to publish."
            exit 1
          fi

      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath $(find . -iname '*.vsix')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
